name: Benchmark (Java)

on:
  push:
    branches: [main]
    paths:
      - src/benchmark/claude.ts
      - src/benchmark/java/**
      - src/harness/skills/jahia-dev-java/**
      - src/harness/skills/jahia-java-*/**
      - src/harness/skills/jahia-review-java/**
  workflow_dispatch: {}

# The agent runs without permission prompts: give it a read-only token, and keep it out of .git/config
permissions:
  contents: read

jobs:
  benchmark-java:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4

      - run: yarn install && yarn build

      - id: benchmark
        run: yarn benchmark:java
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_API_TOKEN }}

      - name: Prepare the benchmark project for upload
        if: always() && steps.benchmark.outputs.project_dir
        run: rm -rf ${{ steps.benchmark.outputs.project_dir }}/forsure-quote/target

      - uses: actions/upload-artifact@v7
        if: always() && steps.benchmark.outputs.project_dir
        with:
          name: benchmark-java-project
          path: ${{ steps.benchmark.outputs.project_dir }}
          include-hidden-files: true
